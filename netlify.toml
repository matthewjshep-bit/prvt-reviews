# Netlify build config for the messaging-app frontend.
# This is a monorepo — the React app lives in messaging-app/, not the repo root.
# `publish` is relative to `base`, so it resolves to messaging-app/dist.
[build]
  base = "messaging-app"
  command = "npm run build"
  publish = "dist"
  # With `base` set, Netlify's default is to SKIP the build when nothing under
  # that directory changed. The app also bundles /shared via the @shared Vite
  # alias, so a shared-only commit (a config schema, the Conversation AI
  # starter) built a stale console and said nothing — the deploy simply never
  # ran. Watch both directories. Paths are relative to `base`; exit 0 = skip.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../shared"

# The pre-overhaul entry points (home.html/dashboard.html/settings.html) no
# longer exist — send anything that isn't a real file to the app. Query strings
# (?location_id=...) are preserved, so old GHL menu links keep working.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
